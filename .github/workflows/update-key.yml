name: Update Daily Key

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-key:
    runs-on: ubuntu-latest

    steps:
      - name: Generate and update key.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_BRANCH: main
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import secrets
          import urllib.request
          import urllib.error

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GH_REPO"]
          branch = os.environ["GH_BRANCH"]
          path = "key.txt"

          new_key = "-".join(f"{secrets.randbelow(10000):04d}" for _ in range(4))
          print("NEW_KEY=" + new_key)

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          get_url = f"https://api.github.com/repos/{repo}/contents/{path}?ref={branch}"

          req = urllib.request.Request(get_url, headers=headers)
          with urllib.request.urlopen(req) as res:
              data = json.loads(res.read().decode())

          old_sha = data["sha"]
          old_content = base64.b64decode(data["content"]).decode().strip()
          print("OLD_KEY=" + old_content)

          body = {
              "message": "Update access key",
              "content": base64.b64encode((new_key + "\n").encode()).decode(),
              "sha": old_sha,
              "branch": branch,
          }

          put_url = f"https://api.github.com/repos/{repo}/contents/{path}"
          req = urllib.request.Request(
              put_url,
              data=json.dumps(body).encode(),
              headers={**headers, "Content-Type": "application/json"},
              method="PUT"
          )

          try:
              with urllib.request.urlopen(req) as res:
                  result = json.loads(res.read().decode())
                  print("UPDATED_COMMIT=" + result["commit"]["sha"])
          except urllib.error.HTTPError as e:
              print("ERROR_STATUS=", e.code)
              print(e.read().decode())
              raise
          PY
