name: Update Daily Key

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-key:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Generate new key
        run: |
          python3 - <<'PY'
          import secrets

          old_key = ""
          try:
              with open("key.txt", "r") as file:
                  old_key = file.read().strip()
          except FileNotFoundError:
              pass

          while True:
              new_key = "-".join(f"{secrets.randbelow(10000):04d}" for _ in range(4))
              if new_key != old_key:
                  break

          with open("key.txt", "w") as file:
              file.write(new_key + "\n")

          print("Old key:", old_key)
          print("New key:", new_key)
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add key.txt
          git commit -m "Update access key"
          git push
